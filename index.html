<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A pixel-art startup game. Nine months, one choice a month. See how long your company lasts.">
<title>Bankrupt Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Silkscreen&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
:root{
  --night:#1b2036; --ink:#20182b; --paper:#f4e6c8; --paper2:#e4cfa3;
  --gold:#f2b63c; --rose:#d9485f; --mint:#58b58a; --mute:#a9a2b8;
  --cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --title:"ZCOOL QingKe HuangYou","Silkscreen","Noto Sans SC",sans-serif;
  --num:"Silkscreen","Noto Sans SC",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--cn);font-weight:500;font-size:18px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--title);font-size:32px;font-weight:400;color:var(--gold);letter-spacing:.04em;text-shadow:3px 3px 0 var(--ink)}
#company{color:var(--paper);font-size:16px;min-width:0;flex-basis:100%;order:3}
#lang,#sfx{appearance:none;font:inherit;font-size:15px;color:var(--ink);background:var(--paper2);border:3px solid var(--ink);padding:2px 10px;cursor:pointer}
#stage{position:relative;border:4px solid var(--ink);box-shadow:0 0 0 3px var(--paper2);background:#000;line-height:0}
canvas#scene{width:100%;height:auto;display:block;image-rendering:pixelated}
#stage.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}}
#ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--ink);padding:6px 8px;min-width:0}
.stat b{display:block;font-family:var(--num);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:14px;color:var(--paper2)}
#cash.low{color:var(--rose)}
#cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.who{font-size:15px;background:#2b3150;border:3px solid #2b3150;padding:4px 7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who.on{border-color:var(--gold)}
.who.left{opacity:.45;text-decoration:line-through}
.bar{display:block;height:6px;background:var(--ink);margin-top:4px}
.bar i{display:block;height:100%;background:var(--mint);transition:width .4s steps(6)}
.bar i.bad{background:var(--rose)}
#box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--paper2);padding:12px;display:flex;flex-direction:column;gap:10px}
#play{display:grid;gap:10px}
#talk{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;min-height:110px;cursor:pointer}
canvas#face{width:64px;height:64px;image-rendering:pixelated;background:var(--paper2);border:3px solid var(--ink)}
#speaker{font-size:18px;font-weight:700;color:#7a2f0c}
#narr{font-size:16px;color:#4a3b30;min-height:1.4em}
#line{font-size:20px;font-weight:700;min-height:1.6em;overflow-wrap:anywhere}
#choices{display:grid;gap:8px}
.opt{appearance:none;font:inherit;font-size:17px;font-weight:700;background:var(--paper2);color:var(--ink);border:3px solid var(--ink);padding:10px 12px;min-height:48px;cursor:pointer;text-align:left;box-shadow:3px 3px 0 var(--ink)}
.opt:hover{background:var(--gold)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt b{font-family:var(--num);font-weight:400;margin-right:8px;color:#7a2f0c}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input[type=text]{font:inherit;width:100%;background:#fffaf0;color:var(--ink);border:3px solid var(--ink);padding:7px 9px;border-radius:0;min-width:0}
.go{appearance:none;font:inherit;font-weight:700;background:var(--rose);color:#fff7e6;border:3px solid var(--ink);padding:9px 18px;min-height:46px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ghost{background:var(--paper2);color:var(--ink)}
#start{display:grid;gap:10px}
#start label{display:grid;gap:3px;font-size:16px;color:#4a3b30}
#start p{margin:0;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
#cert{position:relative;background:#fbf3df;border:3px double var(--ink);padding:14px 16px;display:grid;gap:6px;overflow:hidden}
#cert h2{margin:0;font-family:var(--title);font-weight:400;font-size:26px;letter-spacing:.1em;padding-right:130px}
#cert dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
#cert dt{color:#4a3b30}#cert dd{margin:0;overflow-wrap:anywhere}
#stamp{position:absolute;right:12px;top:10px;border:4px solid var(--rose);color:var(--rose);font-family:var(--title);font-size:22px;padding:0 8px;transform:rotate(-10deg);opacity:.85}
#shot{display:grid;gap:6px;margin-top:10px}
#shot img{width:100%;max-width:100%;border:3px solid var(--ink)}
#shot p{margin:0;font-size:16px;color:#4a3b30}
@media (max-width:420px){#ledger,#cast{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:26px}#cert h2{padding-right:0;padding-top:34px}}
@media (prefers-reduced-motion:reduce){#stage.shake{animation:none}.bar i{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header><h1 id="h1"></h1><span class="row" style="gap:8px"><button id="sfx" type="button"></button><button id="lang" type="button"></button></span><div id="company"></div></header>
  <div id="stage"><canvas id="scene" width="320" height="150" aria-hidden="true"></canvas></div>
  <div id="ledger">
    <div class="stat"><b id="month">1/9</b><span id="lMonth"></span></div>
    <div class="stat"><b id="cash"></b><span id="lCash"></span></div>
    <div class="stat"><b id="burn"></b><span id="lBurn"></span></div>
    <div class="stat"><b id="cust">0</b><span id="lCust"></span></div>
  </div>
  <div id="cast"></div>
  <div id="box">
    <div id="start">
      <p id="intro"></p>
      <label for="cname"><span id="lName"></span><input id="cname" type="text" maxlength="24"></label>
      <label for="cbiz"><span id="lWhat"></span><input id="cbiz" type="text" maxlength="50"></label>
      <div class="row"><button class="go" id="open" type="button"></button></div>
    </div>
    <div id="play" hidden>
      <div id="talk">
        <canvas id="face" width="16" height="16" aria-hidden="true"></canvas>
        <div style="min-width:0">
          <div id="speaker"></div>
          <div id="narr"></div>
          <div id="line" aria-live="polite"></div>
        </div>
      </div>
      <div id="choices"></div>
    </div>
    <div id="end" hidden>
      <div id="cert">
        <div id="stamp"></div>
        <h2 id="certTitle"></h2>
        <dl>
          <dt id="dN"></dt><dd id="cN"></dd>
          <dt id="dB"></dt><dd id="cB"></dd>
          <dt id="dM"></dt><dd id="cM"></dd>
          <dt id="dC"></dt><dd id="cC"></dd>
          <dt id="dW"></dt><dd id="cW"></dd>
        </dl>
      </div>
      <div class="row" style="margin-top:10px"><button class="go" id="image" type="button"></button><button class="go ghost" id="copy" type="button"></button><button class="go ghost" id="again" type="button"></button></div>
      <div id="shot" hidden><img id="shotImg" alt=""><p id="shotTip"></p></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

const SFX=(()=>{let ac=null,on=true;try{on=localStorage.getItem('bankrupt-sim-sfx')!=='off'}catch(e){}
  function ctx(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}ac=new A()}if(ac.state==='suspended')ac.resume();return ac}
  function tone(f,d,o={}){const a=on&&ctx();if(!a)return;const t0=a.currentTime+(o.at||0),os=a.createOscillator(),g=a.createGain();os.type=o.type||'square';os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+d);g.gain.setValueAtTime(o.v||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);os.connect(g);g.connect(a.destination);os.start(t0);os.stop(t0+d+.03)}
  function noise(d,v){const a=on&&ctx();if(!a)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const n=a.createBufferSource(),g=a.createGain();g.gain.value=v;n.buffer=b;n.connect(g);g.connect(a.destination);n.start()}
  const seq=(ns,st,o={})=>ns.forEach((f,i)=>{if(f)tone(f,st*.9,{...o,at:(o.at||0)+i*st})});
  const VOICE={cto:330,ops:520,inv:196,narr:262};
  return{get on(){return on},
    toggle(){on=!on;try{localStorage.setItem('bankrupt-sim-sfx',on?'on':'off')}catch(e){}if(on)this.pick()},
    unlock(){if(on)ctx()},
    blip(sp){tone((VOICE[sp]||300)*(.94+Math.random()*.12),.035,{v:.022})},
    pick(){seq([660,990],.05,{v:.05})},
    next(){tone(523,.06,{v:.04})},
    open(){seq([523,659,784],.08,{v:.05})},
    coin(){seq([988,1319],.08,{v:.05,at:.12})},
    loss(){seq([392,262],.1,{type:'triangle',v:.09,at:.12})},
    shake(){noise(.3,.12)},

    quit(){seq([392,349,294,0,196],.17,{type:'triangle',v:.1})},
    dead(){seq([392,370,349,330,0,262,0,196],.22,{type:'triangle',v:.1})},
    won(o){seq([523,659,784,1047,0,784,1047],.11,{v:.06,...o})},
    cat(){this.meow();this.won({at:.7})}}
})();

  return cv.toDataURL('image/png');
}
$('image').onclick=()=>{$('shotImg').alt=$('certTitle').textContent;$('shotImg').src=makeImage();$('shot').hidden=false;$('shot').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})};
$('copy').onclick=async()=>{const L=t(),x=$('certTitle').textContent+'\n'+L.dN+'：'+$('cN').textContent+'\n'+L.dB+'：'+$('cB').textContent+'\n'+L.dM+'：'+$('cM').textContent+'\n'+$('dC').textContent+'：'+$('cC').textContent+'\n'+L.dW+'：'+$('cW').textContent;
  try{await navigator.clipboard.writeText(x);$('copy').textContent=L.copied}catch(e){const s=getSelection(),r=document.createRange();r.selectNodeContents($('cert'));s.removeAllRanges();s.addRange(r);$('copy').textContent=L.selected}
  setTimeout(()=>{$('copy').textContent=t().copy},1800)};
$('open').onclick=begin;
$('again').onclick=()=>{S=null;endInfo=null;view=null;$('end').hidden=true;$('start').hidden=false;staticText()};
$('sfx').onclick=()=>{SFX.toggle();$('sfx').textContent=SFX.on?t().sfxOn:t().sfxOff};
$('lang').onclick=()=>{lang=lang==='zh'?'en':'zh';try{localStorage.setItem(KEY,lang)}catch(e){}staticText()};
['cname','cbiz'].forEach(i=>$(i).addEventListener('input',()=>{$(i).dataset.dirty='1'}));
staticText();
requestAnimationFrame(draw);
</script>
